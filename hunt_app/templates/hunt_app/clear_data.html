<!DOCTYPE html>
<html>
<head>
    <title>Confirm Clear Data</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      integrity="sha384-..."
      crossorigin="anonymous"
    />
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h3>Warning: Data Deletion</h3>
                    </div>
                    <div class="card-body">
                        <h4>Are you sure you want to clear all data?</h4>
                        <p>This action will delete all answers and reset all group points. It cannot be undone.</p>
                        
                        {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                        {% endif %}
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="confirmation_password" class="form-label">Enter password to confirm:</label>
                                <input type="password" class="form-control" id="confirmation_password" name="confirmation_password" required>
                            </div>
                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-danger">Yes, clear all data</button>
                                <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
